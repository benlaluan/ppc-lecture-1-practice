name: Collaborative workflow

on:
  push:
    branches:
      - main


jobs:
  update_html_and_readme:
    runs-on: ubuntu-latest
    steps:
    #step1 - check repo 
    - name: Checkout Repository
      uses: actions/checkout@v3

    #step 2 - update index.html
    - name: Check GitHub Username
      run: echo "Workflow triggered by ${{ github.actor }}"

    #check if github actor = team leader
    - name: Update index.html (Team Leader)
      if: github.actor == 'benlaluan'
      run: |
        sed -i '/<\/body>/i <p>Updated by Team Leader on '"$(date)"'</p>' index.html

    # Check if github actor is member 1
    - name: Update index.html (Member 1)
      if: github.actor == 'team-member-1'
      run: |
        sed -i '/<\/body>/i <p>Updated by Member 1 on '"$(date)"'</p>' index.html


      
