name: Collaborative workflow

on:
  push:
    branches:
      - main


jobs:
  update_html_and_readme:
    runs-on: ubuntu-latest
    steps:
    #step1 - check repo 
    - name: Checkout Repository
      uses: actions/checkout@v3

    #step 2 - update index.html
    - name: Check GitHub Username
      run: echo "Workflow triggered by ${{ github.actor }}"

    #check if github actor = team leader
    - name: Update index.html (Team Leader)
      if: github.actor == 'benlaluan'
      run: |
        sed -i '/<\/body>/i <p>Updated by Team Leader on '"$(date)"'</p>' index.html

    # Check if github actor is member 1
    - name: Update index.html (Member 1)
      if: github.actor == 'team-member-1'
      run: |
        sed -i '/<\/body>/i <p>Updated by Member 1 on '"$(date)"'</p>' index.html

    # Check if github acor is member 2
    - name: Update index.html (Member 2)
      if: github.actor == 'team-member-2'
      run: |
        sed -i '/<\/body>/i <p>Updated by Member 2 on '"$(date)"'</p>' index.html

    # step 3 -> update read me
    - name: Update README
      run: |
        echo "### Updated by ${{ github.actor }} on $(date '+%Y-%m-%d %H:%M:%S') [Commit: $(git rev-parse --short HEAD)]" >> README.md
        
    # step 4: ommit changes to index.html and README
    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Workflow: Updated HTML and README for ${{ github.actor }}" || echo "No changes to commit"
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
        git push origin main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        



      
